<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokégram | Catch the Moment</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-content">
                <div class="logo">
                    <div class="logo-img-css"></div>
                    <span class="logo-text">Pokégram</span>
                </div>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search Trainers or Pokémon...">
                </div>
                <div class="nav-icons">
                    <i class="fas fa-home home-link active" title="Go to Pokémon Center (Home)"></i>
                    <i class="far fa-paper-plane message-link" title="Pidgey Post (Direct Messages)"></i>
                    <i class="far fa-plus-square create-link" title="Catch a Pokémon (New Post)"></i>
                    <i class="far fa-compass explore-link" title="Open Town Map (Explore)"></i>
                    <i class="far fa-heart friendship-link" title="Check Friendship (Notifications)"></i>
                    <div class="profile-pic-small trainer-link" title="Open Trainer Card (Profile)">
                        <img src="assets/my_profile.png" alt="Profile">
                    </div>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="feed-section">
                <!-- Stories -->
                <div class="stories-container">
                    <div class="story">
                        <div class="story-img-wrapper active">
                            <img src="assets/story1.png" alt="Ash">
                        </div>
                        <span>Ash_K</span>
                    </div>
                    <div class="story">
                        <div class="story-img-wrapper active">
                            <img src="assets/story2.png" alt="Misty">
                        </div>
                        <span>Misty_Water</span>
                    </div>
                    <div class="story">
                        <div class="story-img-wrapper active">
                            <img src="assets/story3.png" alt="Brock">
                        </div>
                        <span>RockSolid</span>
                    </div>
                    <div class="story">
                        <div class="story-img-wrapper">
                            <img src="assets/story4.png" alt="Gary">
                        </div>
                        <span>Gary_Oak</span>
                    </div>
                    <div class="story">
                        <div class="story-img-wrapper">
                            <img src="assets/story5.png" alt="Cynthia">
                        </div>
                        <span>Champion_C</span>
                    </div>
                </div>

                <!-- Feed -->
                <div id="feed" class="feed">
                    <!-- Posts will be injected here -->
                </div>
            </div>

            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="user-profile">
                    <div class="profile-pic-medium">
                        <img src="assets/my_profile.png" alt="User">
                    </div>
                    <div class="user-info">
                        <span class="username">red_champion</span>
                        <span class="full-name">Red Kanto</span>
                    </div>
                    <button class="switch-btn">Switch</button>
                </div>

                <div class="suggestions">
                    <div class="suggestions-header">
                        <span>Suggestions For You</span>
                        <button class="see-all-btn">See All</button>
                    </div>
                    <div class="suggestion-list">
                        <!-- Suggestions will be injected here -->
                    </div>
                </div>

                <footer class="sidebar-footer">
                    <p>About • Help • Press • API • Jobs • Privacy • Terms • Locations • Language • Pokégram Verified
                    </p>
                    <p class="copyright">© 2026 POKÉGRAM FROM SILPH CO.</p>
                </footer>
            </aside>
        </main>

        <!-- Bottom Mobile Nav -->
        <nav class="mobile-nav">
            <i class="fas fa-home home-link active"></i>
            <i class="fas fa-search"></i>
            <i class="far fa-plus-square create-link" title="Catch a Pokémon (New Post)"></i>
            <i class="far fa-heart friendship-link" title="Check Friendship (Notifications)"></i>
            <div class="profile-pic-tiny trainer-link" title="Open Trainer Card (Profile)">
                <img src="assets/my_profile.png" alt="Profile">
            </div>
        </nav>
    </div>
    <script src="script.js"></script>
</body>

</html>
